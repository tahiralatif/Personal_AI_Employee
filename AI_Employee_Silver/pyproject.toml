[project]
name = "ai-employee-silver"
version = "0.1.0"
description = "Silver Tier AI Employee - Automatic file collection from Gmail, WhatsApp, LinkedIn with scheduled tasks and MCP coordination"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Bronze Tier dependencies (inherited)
    "watchdog>=4.0.0",
    "python-dotenv>=1.0.0",
    # Gmail Integration
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=1.0.0",
    # WhatsApp Integration (Meta Business SDK)
    "requests>=2.31.0",
    # LinkedIn Integration
    "linkedin-api-client>=0.1.0",
    # Scheduler
    "apscheduler>=3.10.0",
    # MCP Coordination
    "filelock>=3.13.0",
    # Utilities
    "pytz>=2024.1",
    "croniter>=2.0.0",
    "playwright>=1.58.0",
    "twilio>=9.10.2",
    "openai-agents>=0.10.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_employee_silver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "W", "I", "N", "D", "UP"]
ignore = ["D100", "D104"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
